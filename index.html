<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Don Benson | Software Developer</title>

    <meta name="description"
          content="Personal software development site of Don Benson.">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(circle at 20% 20%, #172033 0%, transparent 35%),
                radial-gradient(circle at 80% 80%, #111b2a 0%, transparent 35%),
                #090d14;

            color: #e8edf5;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        main {
            width: min(90%, 760px);
            padding: 48px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 64px;
        }

        .mark {
            width: 44px;
            height: 44px;

            display: grid;
            place-items: center;

            border: 1px solid #334155;
            border-radius: 10px;

            color: #67e8f9;
            font-weight: 700;
            letter-spacing: -2px;
        }

        .brand-name {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.04em;
        }

        .eyebrow {
            color: #67e8f9;
            font-family: monospace;
            font-size: 0.9rem;
            margin-bottom: 16px;
        }

        h1 {
            font-size: clamp(2.8rem, 8vw, 5.2rem);
            line-height: 0.98;
            letter-spacing: -0.055em;
            margin-bottom: 24px;
        }

        .intro {
            max-width: 620px;

            color: #9ba8ba;
            font-size: 1.15rem;
            line-height: 1.7;
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;

            margin-top: 40px;
        }

        .links a {
            color: #dce5f1;
            text-decoration: none;

            border: 1px solid #2d394a;
            border-radius: 8px;

            padding: 11px 17px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease;
        }

        .links a:hover {
            border-color: #67e8f9;
            background: rgba(103, 232, 249, 0.06);
        }

        footer {
            margin-top: 80px;

            color: #586577;
            font-size: 0.85rem;
        }

        .cursor {
            color: #67e8f9;
        }
    </style>
</head>

<body>

<main>

    <div class="brand">
        <div class="mark">DWB</div>
        <div class="brand-name">dwbcode.dev</div>
    </div>

    <p class="eyebrow">&gt; software_developer<span class="cursor">_</span></p>

    <h1>
        Don Benson
    </h1>

    <p class="intro">
        Software developer focused on building practical,
        maintainable applications and exploring modern
        software development technologies.
    </p>

    <div class="links">
        <a href="https://github.com/dwbcode">
            GitHub
        </a>

        <a href="mailto:don@dwbcode.dev">
            don@dwbcode.dev
        </a>
    </div>

    <footer>
        © 2026 Don Benson
    </footer>

</main>

</body>
</html>
